<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="brand">Call Center Simulation</p>
      <h1>Live floor board</h1>
      <p class="lede">Start a free-threaded simulation and watch agents flip between idle and busy.</p>
    </header>

    <section class="controls" aria-label="Simulation controls">
      <form id="config-form">
        <label>Freshers <input name="number_of_freshers" type="number" value="3" min="1" max="1000" required aria-label="Number of freshers" /></label>
        <label>Run time (s) <input name="run_time" type="number" value="8" min="1" step="0.1" required aria-label="Run time in seconds" /></label>
        <label>Calls / wave min <input name="min_calls_per_wave" type="number" value="1" min="0" required aria-label="Minimum calls per wave" /></label>
        <label>Calls / wave max <input name="max_calls_per_wave" type="number" value="4" min="0" required aria-label="Maximum calls per wave" /></label>
        <label>Sleep min <input name="min_sleep_interval" type="number" value="1" min="0" required aria-label="Minimum sleep interval" /></label>
        <label>Sleep max <input name="max_sleep_interval" type="number" value="2" min="1" required aria-label="Maximum sleep interval" /></label>
        <label>Call dur min <input name="min_call_duration" type="number" value="1" min="0" required aria-label="Minimum call duration" /></label>
        <label>Call dur max <input name="max_call_duration" type="number" value="2" min="1" required aria-label="Maximum call duration" /></label>
        <label>Seed <input name="seed" type="number" value="42" aria-label="Random seed" /></label>
        <div class="actions">
          <button type="submit" id="start-btn" aria-label="Start simulation">Start</button>
          <button type="button" id="stop-btn" aria-label="Stop simulation" disabled>Stop</button>
        </div>
      </form>
      <p id="status-line" class="status" aria-live="polite">Status: idle</p>
    </section>

    <section class="board" aria-label="Agent status">
      <h2>Agents</h2>
      <div id="agents" class="agents"></div>
    </section>

    <section class="stats" aria-label="Statistics">
      <h2>Stats</h2>
      <pre id="stats">{}</pre>
    </section>

    <section class="events" aria-label="Event log">
      <h2>Events</h2>
      <ul id="event-log"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
